services:
  app:
    image: annotation-assistant:latest
    container_name: annotation-assistant
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - VL_MODEL=qwen-vl-max
      - KB_DIR=/app/data/kb
      - INDEX_DIR=/app/data/index
    volumes:
      # Bind-mount code + data so you can edit on the host and just restart
      # (docker compose restart) for easy debugging. Data persists learning
      # entries and uploaded images.
      - ./src:/app/src
      - ./web:/app/web
      - ./data:/app/data
